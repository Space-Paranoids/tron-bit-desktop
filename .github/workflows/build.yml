name: Build

# Builds and tests Bit for Windows, macOS and Linux (PC and 64-bit ARM). The
# program is self-contained: its model, sounds and fonts are built into the
# executable.

# To save GitHub's free minutes and storage, a push to main only builds and
# tests on Linux. Windows, macOS, ARM Linux and the downloadable packages are
# made for a version tag like v0.3.0, or when the workflow is started by hand
# (Actions > Build > Run workflow). The packages go straight onto the
# release: no workflow artifacts, which count against GitHub's small free
# storage (release files don't).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release for this existing tag (e.g. v0.3.0); leave empty to just build"
        required: false
        default: ""
      systems:
        description: "Which systems to build: all, or linux (PC and ARM only; much cheaper than all)"
        required: false
        default: "all"

# A newer push to the same branch replaces a build still running (saves
# minutes); version tags each get their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FULL: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
  # The release to publish: the pushed tag, or the tag typed in by hand.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}

# Every action below is pinned to an exact commit (the version is in the
# comment), so a changed or hijacked tag can't swap in different code.
# Jobs get only the access they need.
permissions:
  contents: read

jobs:
  # Makes the release for the build jobs to add their packages to.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the release
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "Bit $RELEASE_TAG" --generate-notes \
            || echo "Release $RELEASE_TAG already exists"

  build:
    needs: release
    # (Also when the release job is skipped, as on a push to main.)
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: write
      # (Lets SignPath fetch the unsigned program from this run.)
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Linux builds on Ubuntu 22.04 so the downloads also run on older
        # distributions (their C library is older). ARM is cross-compiled on
        # the same ordinary Linux machine, billed at the Linux rate.
        # (A push to main: Linux only. Started by hand with "linux": both
        # Linux builds. A version tag, or by hand with "all": everything.)
        include: ${{ fromJSON(!(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && '[{"os":"ubuntu-22.04","name":"linux"}]' || inputs.systems == 'linux' && '[{"os":"ubuntu-22.04","name":"linux"},{"os":"ubuntu-22.04","name":"linux-arm64","target":"aarch64-unknown-linux-gnu"}]' || '[{"os":"ubuntu-22.04","name":"linux"},{"os":"ubuntu-22.04","name":"linux-arm64","target":"aarch64-unknown-linux-gnu"},{"os":"windows-latest","name":"windows"},{"os":"macos-latest","name":"macos"}]') }}
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      # Where the program ends up: target/release, or target/<target>/release.
      OUT: target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release
      TARGET_ARG: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # (Pinned to a commit of its "stable" branch, which installs the
      # current stable Rust.)
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target || '' }}
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          key: ${{ matrix.name }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux' && !matrix.target
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libasound2-dev libxkbcommon-dev
      - name: Install ARM Linux build dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          # The ARM (arm64) versions of the same libraries, from Ubuntu's
          # ports archive, plus an ARM cross-compiler.
          sudo dpkg --add-architecture arm64
          # The machine's own archives (a mirror list and security.ubuntu.com)
          # only carry PC packages: limit them to amd64.
          sudo sed -i -E 's/^deb (\[[^]]*\] )?/deb [arch=amd64] /' /etc/apt/sources.list
          codename=$(lsb_release -cs)
          for suite in "$codename" "$codename-updates" "$codename-security"; do
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $suite main restricted universe multiverse"
          done | sudo tee /etc/apt/sources.list.d/arm64.list
          sudo apt-get update
          sudo apt-get install -y pkg-config gcc-aarch64-linux-gnu \
            libgtk-3-dev:arm64 libxdo-dev:arm64 libayatana-appindicator3-dev:arm64 libasound2-dev:arm64 libxkbcommon-dev:arm64
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "PKG_CONFIG_ALLOW_CROSS=1"
            echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
          } >> "$GITHUB_ENV"
      - name: Build
        # --locked: build with exactly the library versions in Cargo.lock.
        run: cargo build --release --locked ${{ env.TARGET_ARG }}
      - name: Test
        # (ARM programs can't run on this PC-type machine.)
        if: ${{ !matrix.target }}
        run: cargo test --release --locked
      # Free code signing for open source from SignPath.io (certificate by
      # the SignPath Foundation). Off until the repository variable
      # SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN are set
      # (Settings > Secrets and variables > Actions); until then the .exe
      # is released unsigned, as before. The unsigned .exe is kept as a
      # workflow artifact for one day only, for SignPath to fetch.
      - name: Hand the unsigned program to SignPath
        id: unsigned
        if: runner.os == 'Windows' && env.FULL == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tron-bit-windows-unsigned
          path: ${{ env.OUT }}/tron-bit.exe
          retention-days: 1
          if-no-files-found: error
      - name: Sign the program (SignPath)
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'tron-bit-desktop' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # (Release signing waits for the request to be approved on
          # signpath.io: up to an hour.)
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - name: Use the signed program
        if: steps.unsigned.outcome == 'success'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature signed/tron-bit.exe
          $sig | Format-List Status, StatusMessage, SignerCertificate
          if ($sig.Status -ne 'Valid') { throw "The signed program's signature isn't valid: $($sig.Status)" }
          Copy-Item signed/tron-bit.exe "$env:OUT/tron-bit.exe" -Force
      - name: Package
        if: env.FULL == 'true'
        shell: bash
        run: |
          mkdir -p dist
          name=${{ matrix.name }}
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          pkg="tron-bit-$version-$name"
          mkdir "$pkg"
          cp README.md "$pkg/"
          case "$RUNNER_OS" in
            Windows)
              # The icon is built into the .exe (build.rs).
              cp "$OUT/tron-bit.exe" "$pkg/"
              7z a "dist/$pkg.zip" "$pkg" > /dev/null
              ;;
            macOS)
              # A Bit.app bundle: the program, its icon, and an Info.plist
              # that makes it a menu bar app with no Dock icon.
              app="$pkg/Bit.app/Contents"
              mkdir -p "$app/MacOS" "$app/Resources"
              cp "$OUT/tron-bit" "$app/MacOS/"
              sed "s/VERSION/$version/g" packaging/macos/Info.plist > "$app/Info.plist"
              set=bit.iconset
              mkdir "$set"
              for s in 16 32 128 256 512; do
                cp "assets/icon/bit-$s.png" "$set/icon_${s}x${s}.png"
                cp "assets/icon/bit-$((s * 2)).png" "$set/icon_${s}x${s}@2x.png"
              done
              iconutil -c icns "$set" -o "$app/Resources/bit.icns"
              ditto -c -k --keepParent "$pkg" "dist/$pkg.zip"
              unzip -l "dist/$pkg.zip"
              ;;
            *)
              # The program plus a menu entry, icons and an install script.
              cp "$OUT/tron-bit" packaging/linux/tron-bit.desktop packaging/linux/install.sh "$pkg/"
              chmod +x "$pkg/install.sh" "$pkg/tron-bit"
              mkdir "$pkg/icons"
              cp assets/icon/bit-{16,32,48,64,128,256,512}.png "$pkg/icons/"
              file "$pkg/tron-bit"
              tar -czf "dist/$pkg.tar.gz" "$pkg"
              tar -tzvf "dist/$pkg.tar.gz"
              ;;
          esac
          ls -l dist
      - name: Add the package to the release
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release upload "$RELEASE_TAG" dist/*.zip dist/*.tar.gz --clobber

  # A SHA256SUMS.txt on the release with the SHA-256 of every download, so
  # anyone can check a download is exactly what this workflow built.
  checksums:
    needs: [release, build]
    if: ${{ !failure() && !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Add SHA256SUMS.txt to the release
        run: |
          mkdir dl && cd dl
          gh release download "$RELEASE_TAG" --pattern '*.zip' --pattern '*.tar.gz'
          sha256sum -- * | tee ../SHA256SUMS.txt
          cd ..
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --clobber
